name: PipelineTrust CI/CD security gate
description: >-
  Assess this repository's GitHub Actions pipelines against the OWASP Top 10 CI/CD risks, enforce your organization's
  policies and fail the job when the gate is not met. Repository code is never executed.
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: Directory to assess
    default: "."
  fail-on:
    description: Fail on findings at or above this severity (critical, high, medium, low, none)
    default: critical
  policies:
    description: Custom policy file or directory (YAML, policy-as-code), relative to the workspace
    default: ""
  fail-on-policy:
    description: Fail when any custom policy is violated
    default: "true"
  max-attack-paths:
    description: Fail when more attack paths than this are found (empty = no limit)
    default: ""
  tools:
    description: External scanners to run (comma list or none). zizmor is installed by this action; others are used if on PATH.
    default: zizmor
  sarif:
    description: Path of the SARIF file to write (upload it with github/codeql-action/upload-sarif)
    default: pipelinetrust.sarif
outputs:
  sarif:
    description: Path of the SARIF report
    value: ${{ steps.scan.outputs.sarif }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - name: Install PipelineTrust CLI
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check -q -r "$ACTION_PATH/backend/requirements-cli.txt"
    - name: Assess pipelines
      id: scan
      shell: bash
      # inputs are passed as environment variables, never interpolated into the script (no template injection)
      env:
        ACTION_PATH: ${{ github.action_path }}
        PT_PATH: ${{ inputs.path }}
        PT_FAIL_ON: ${{ inputs.fail-on }}
        PT_POLICIES: ${{ inputs.policies }}
        PT_FAIL_ON_POLICY: ${{ inputs.fail-on-policy }}
        PT_MAX_PATHS: ${{ inputs.max-attack-paths }}
        PT_TOOLS: ${{ inputs.tools }}
        PT_SARIF: ${{ inputs.sarif }}
      run: |
        abs() { case "$1" in /*) printf '%s' "$1" ;; *) printf '%s' "$GITHUB_WORKSPACE/$1" ;; esac; }
        target="$(abs "$PT_PATH")"; sarif="$(abs "$PT_SARIF")"
        args=(scan "$target" --format sarif --out "$sarif" --tools "$PT_TOOLS" --fail-on "$PT_FAIL_ON" --summary "$GITHUB_STEP_SUMMARY")
        if [ -n "$PT_POLICIES" ]; then
          args+=(--policies "$(abs "$PT_POLICIES")")
          [ "$PT_FAIL_ON_POLICY" = "true" ] && args+=(--fail-on-policy)
        fi
        [ -n "$PT_MAX_PATHS" ] && args+=(--max-attack-paths "$PT_MAX_PATHS")
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"
        cd "$ACTION_PATH/backend"
        python -m app.cli "${args[@]}"
