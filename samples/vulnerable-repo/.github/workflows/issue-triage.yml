name: Issue triage
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: write-all

jobs:
  triage:
    runs-on: [self-hosted, linux]
    steps:
      - name: Echo title
        run: |
          echo "New issue received"
          echo "Title: ${{ github.event.issue.title }}"
          ./scripts/label.sh "${{ github.event.comment.body }}"
      - uses: actions/github-script@v7
        with:
          script: |
            const body = "${{ github.event.issue.body }}";
            console.log(body);
